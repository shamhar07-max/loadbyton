# Render Blueprint for Loadbyton — one service: Express serves both the
# API and the built SPA (matches "production mode" in docs/DEVELOPER_GUIDE.md).
#
# PERSISTENCE + DATA RESIDENCY — read before deploying real (non-demo) data:
#   Render has no UAE/GCC region (closest is Frankfurt), and its free plan has
#   no attached disk — server/data/loadbyton.db resets on every
#   restart/redeploy. This file is now wired for the least-bad Render option
#   (paid `starter` plan + persistent disk + Frankfurt, the nearest region to
#   the UAE Render offers). For an actual UAE-resident, $0 alternative, use
#   `deploy/oracle-cloud/` instead — Oracle Cloud's Always Free tier includes
#   a real Abu Dhabi region (me-abudhabi-1) with persistent block storage at
#   no cost. See deploy/oracle-cloud/README.md for the walkthrough.
#
# Either way: this file alone was previously the entire deploy story, which
# is how a demo-only free-tier config ended up implied as production-ready.
# Treat `plan: free` / `region: oregon` as a demo mode only, never as the
# target for a customer's real data.
services:
  - type: web
    name: loadbyton
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: FRONTEND_URL
        value: https://loadbyton.onrender.com
      - key: DB_PATH
        value: /data/loadbyton.db
      - key: ENCRYPTION_KEY
        generateValue: true   # AES-256-GCM key for IBAN/TRN field encryption — see server/lib/crypto.js
    disk:
      name: loadbyton-data
      mountPath: /data
      sizeGB: 1

# --- Demo-mode fallback (no card required, no data persistence guarantee) ---
# Uncomment this service and comment out the one above to go back to a
