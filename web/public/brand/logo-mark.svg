<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loadbyton mark">
  <!--
    The Loadbyton mark: "the container plate" — an ink, ribbed-panel tile with
    corner rivets (real container corner-castings), a white load pictogram at
    the centre, flanked by the two crimson bars that mark every Loadbyton
    wordmark. Fixed ink/white/crimson on every surface — like a physical
    container plate, this tile reads the same regardless of what it sits on,
    unlike a recolorable currentColor glyph.
  -->
  <defs>
    <clipPath id="lb-tile-64">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#lb-tile-64)">
    <rect width="64" height="64" fill="#111113" />
    <g stroke="#1C1C1F" stroke-width="1.6" opacity="0.7">
      <line x1="8" y1="0" x2="8" y2="64" />
      <line x1="18" y1="0" x2="18" y2="64" />
      <line x1="46" y1="0" x2="46" y2="64" />
      <line x1="56" y1="0" x2="56" y2="64" />
    </g>
  </g>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2A2A2E" stroke-width="1" />
  <g fill="#2A2A2E">
    <circle cx="9" cy="9" r="2.1" />
    <circle cx="55" cy="9" r="2.1" />
    <circle cx="9" cy="55" r="2.1" />
    <circle cx="55" cy="55" r="2.1" />
  </g>
  <rect x="19" y="16" width="3" height="32" rx="1.5" fill="#D6321F" />
  <rect x="42" y="16" width="3" height="32" rx="1.5" fill="#D6321F" />
  <rect x="27" y="23" width="10" height="18" rx="2.5" fill="#F8FAFC" />
</svg>
